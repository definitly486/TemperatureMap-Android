name: Android Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; the APK will be published unsigned."
          fi

      - name: Sign release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*-signed.apk' | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -v 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release-keystore.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out app-release.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app-release.apk
          rm -f "$RUNNER_TEMP/release-keystore.jks" "$RUNNER_TEMP/aligned.apk"

      - name: Prepare unsigned APK
        if: steps.signing.outputs.configured != 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" app-release-unsigned.apk

      - name: Select APK for publication
        id: apk
        shell: bash
        run: |
          if [[ "${{ steps.signing.outputs.configured }}" == "true" ]]; then
            echo "path=app-release.apk" >> "$GITHUB_OUTPUT"
            echo "name=TemperatureMap.apk" >> "$GITHUB_OUTPUT"
          else
            echo "path=app-release-unsigned.apk" >> "$GITHUB_OUTPUT"
            echo "name=TemperatureMap-unsigned.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TemperatureMap-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('TemperatureMap {0}', github.ref_name) || format('TemperatureMap build {0}', github.run_number) }}
          body: |
            APK automatically built from commit ${{ github.sha }}.

            ${{ steps.signing.outputs.configured == 'true' && 'This APK is signed and can be installed.' || 'WARNING: This APK is unsigned because signing secrets are not configured. Android will not install it until it is signed.' }}
          make_latest: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
