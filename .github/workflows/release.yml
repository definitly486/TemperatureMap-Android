name: Android Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" app-release-unsigned.apk

      - name: Select APK for publication
        id: apk
        run: |
          echo "path=app-release-unsigned.apk" >> "$GITHUB_OUTPUT"
          echo "name=TemperatureMap-unsigned.apk" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TemperatureMap-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('TemperatureMap {0} (Pre-release)', github.ref_name) || format('TemperatureMap build {0} (Pre-release)', github.run_number) }}
          body: |
            APK automatically built from commit ${{ github.sha }}.

            ${{ steps.signing.outputs.configured == 'true' && 'This APK is intentionally unsigned for personal use.' || 'This APK is intentionally unsigned for personal use. Sign it locally before installing if your device requires a signed APK.' }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
